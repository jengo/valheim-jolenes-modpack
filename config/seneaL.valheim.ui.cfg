# Conservative SeneaL UI defaults. BepInEx may add other keys on launch.
[Inventory]
Slots = 32
ActionSlotCount = 6
KeySlotCount = 2
Equipment = true
Wallet = true
# Allow item highlights and backgrounds drawn by other mods in inventory slots.
SlotForeign = false

[HUD]
ActionSlots = true

# SeneaL UI 1.2.3: crafting/upgrading use chests within range of the station.
[Chests]
FromChests = true
ChestRange = 100
BuildFromChests = true
BuildRange = 100

[Automation]
Smelters = true
SmelterAuto = true

[Map]
OreDetect = true
MarkerByView = true

[Server]
Enforce = true
AllowCraftFromChests = true
MaxCraftRange = 100
AllowBuildFromChests = true
MaxBuildRange = 100
AllowOreDetect = true
AllowShowAllRecipes = false
AllowCoinWeight = false
MaxSlots = 32
MaxActionSlots = 6
AllowKeySlots = true
AllowSmelterAuto = true
AllowHoverTimers = true
AllowWallet = true
