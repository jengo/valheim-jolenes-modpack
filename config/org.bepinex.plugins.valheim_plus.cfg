# Jolene's Reasonable and QOL Pack - conservative Valheim Plus overrides
# Everything not listed here remains at the mod's default (disabled).
# Fire sources consume normal fuel and refill from nearby chests.
[FireSource]
enabled = true
torches = false
fires = false
autoFuel = true
autoRange = 10
ignorePrivateAreaCheck = false

# Charcoal kiln: move wood from chests in, coal to chests out.
# Vanilla speed, capacity and recipes are unchanged.
[Kiln]
enabled = true
autoFuel = true
autoDeposit = true
autoRange = 10
stopAutoFuelThreshold = 100
ignorePrivateAreaCheck = false

# Smelter: ore and coal from chests; ingots deposited to nearby chests.
[Smelter]
enabled = true
autoFuel = true
autoDeposit = true
autoRange = 10
ignorePrivateAreaCheck = false

# Blast furnace: same convenience, vanilla processing limits.
[Furnace]
enabled = true
autoFuel = true
autoDeposit = true
autoRange = 10
allowAllOres = false
ignorePrivateAreaCheck = false

# Keep players aligned with the server's ValheimPlus version/config.
[Server]
enabled = true
enforceMod = true
serverSyncsConfig = true
