name: Lint and release modpack

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    concurrency:
      group: modpack-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint manifest and package
        run: python3 scripts/validate.py
      - name: Require tag to match manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version_number"])')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag must equal $expected"; exit 1; }
      - name: Build ZIP
        run: python3 scripts/build.py
      - name: Test publishing integration without network access
        run: python3 scripts/test_publish.py
      - name: Validate ZIP structure
        run: |
          python3 - <<'PYCODE'
          import glob, zipfile
          files = glob.glob('dist/*.zip')
          assert len(files) == 1
          with zipfile.ZipFile(files[0]) as z:
              assert {'manifest.json','README.md','icon.png','config/seneaL.valheim.ui.cfg'} <= set(z.namelist())
              assert z.testzip() is None
          PYCODE
      - name: Prepare upload-ready CI artifact
        run: |
          python3 - <<'PYCODE'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.zip')[0]) as z:
              z.extractall('dist/artifact')
          PYCODE
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: valheim-modpack
          path: dist/artifact/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version_number"])')"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Bump manifest.json to publish another release."
          else
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "$tag" --notes-file CHANGELOG.md
          fi
      - name: Publish to Thunderstore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          THUNDERSTORE_API_TOKEN: ${{ secrets.THUNDERSTORE_API_TOKEN }}
          THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE || 'Jolene' }}
          THUNDERSTORE_CATEGORIES: ${{ vars.THUNDERSTORE_CATEGORIES || 'modpacks' }}
        run: python3 scripts/publish.py
